name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Lint (correctness rules only, see pyproject.toml)
        run: python -m ruff check .
      - name: Tests (offline by construction; no secrets are available here)
        run: python -m pytest -q

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t heatshield:ci .
      - name: Run the image the public demo runs
        run: |
          docker run -d --name hs -p 8000:7860 heatshield:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/health > /dev/null && break; sleep 1; done
          curl -fs http://127.0.0.1:8000/health
          curl -fs -o /dev/null http://127.0.0.1:8000/demo
          curl -fs -X POST http://127.0.0.1:8000/v1/demo/no-breach -H 'content-type: application/json' -d '{}' > /dev/null
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/v1/sites -H 'content-type: application/json' -d '{}')
          test "$code" = "401" || { echo "an unauthenticated write returned $code"; exit 1; }
          test "$(docker exec hs id -u)" != "0" || { echo "the container runs as root"; exit 1; }
      - if: failure()
        run: docker logs hs
