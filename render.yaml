# Render.com blueprint — "New → Blueprint → connect this repo" deploys the public demo.
# Free plan: the instance sleeps after 15 min idle and wakes on the first request (~1 min).
# Fixture mode: no Nokia credentials exist on the instance, so nothing can be spent or leaked.
services:
  - type: web
    name: heatshield-demo
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NAC_MODE
        value: fixture
      - key: HS_SCHEDULER
        value: "0"
      - key: HS_PLANNER
        value: rules
      # The six one-click scenarios. Demo mode is refused when NAC_MODE=live.
      - key: HS_DEMO_MODE
        value: "1"
      # Secrets are generated per deploy; the repository has no defaults. The console needs none of
      # them, so writes and the webhook stay closed to the public.
      - key: HS_API_TOKEN
        generateValue: true
      - key: WEBHOOK_TOKEN
        generateValue: true
      - key: PHONE_HASH_SALT
        generateValue: true
      # Render's proxy sets X-Forwarded-For; trusting it makes the demo rate limit per visitor, not per proxy.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      # Anonymous-creation caps for a 512 MB free instance (measured: ~5.3 KB per worker).
      - key: HS_MAX_SITES
        value: "50"
      - key: HS_MAX_WORKERS_PER_SITE
        value: "500"
