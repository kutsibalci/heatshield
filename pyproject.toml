[project]
name = "heatshield"
version = "0.2.0.dev0"
description = "Compliance-evidence agent for heat stress on outdoor work sites, using the mobile network (CAMARA / Nokia Network as Code) as the sensing layer."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Hüseyin Kutsi Balcı" }]
requires-python = ">=3.12"
# Runtime dependencies, with compatible ranges. The exact versions CI and the Docker image use are
# pinned in requirements.txt; development tools are in requirements-dev.txt.
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.6,<3",
    "python-dotenv>=1,<2",
]

[project.urls]
Repository = "https://github.com/kutsibalci/heatshield"
Demo = "https://heatshield-demo.onrender.com/demo"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages", "apps"]

[tool.ruff]
target-version = "py312"
line-length = 130
extend-exclude = ["evidence"]

[tool.ruff.lint]
# Correctness only: pyflakes, syntax/runtime errors, bugbear. Formatting is not enforced, so a lint
# run never produces a whole-file diff.
select = ["E4", "E7", "E9", "F", "B"]
# B008: FastAPI's `Body(...)` / `Depends(...)` / `Header(...)` defaults are the framework's idiom.
ignore = ["B008"]
